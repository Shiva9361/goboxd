services:
  goboxd:
    build:
      context: .
      target: runtime
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    image: goboxd:dev
    container_name: goboxd
    ports:
      - "8080:8080"
    privileged: true

  tools:
    build:
      context: .
      target: builder
    image: goboxd-tools:dev
    volumes:
      - .:/src
    working_dir: /src
    profiles: ["tools"]
    entrypoint: []
